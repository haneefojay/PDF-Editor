name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The conversion tests open the converted files with these libraries.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2
      - name: The tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Release notes exist
        run: test -f "docs/releases/$GITHUB_REF_NAME.md"
      - run: pnpm check
      - run: pnpm android:prepare
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - name: Publish the release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="paperless-pdf-editor-$GITHUB_REF_NAME-android.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --verify-tag --title "Paperless PDF Editor $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
